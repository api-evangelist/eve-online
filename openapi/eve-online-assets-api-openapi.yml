            schema:
              description: item_ids array
              items:
                description: item_id integer
                format: int64
                title: post_characters_character_id_assets_locations_item_id
                type: integer
              maxItems: 1000
              minItems: 1
              title: post_characters_character_id_assets_locations_item_ids
