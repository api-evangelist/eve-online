info:
  title: Eve Online Corporation API
  version: '1.36'
  description: 'Operations tagged Corporation across 7 of this provider''s published API definitions: eve-online-openapi.yml, swagger.json, swagger_2.json, swagger_3.json, swagger_4.json, swagger_5.json, swagger_6.json. Each path carries the servers of the definition it was published in.'
