openapi: 3.0.0
info:
  description: An OpenAPI for EVE Online
  title: EVE Swagger Interface Alliance Routes API
  version: '1.36'
servers:
- url: https://esi.evetech.net/latest
tags:
- name: Routes
paths:
  /route/{origin}/{destination}/:
    get:
      description: 'Get the systems between origin and destination


        ---

        Alternate route: `/dev/route/{origin}/{destination}/`


        Alternate route: `/legacy/route/{origin}/{destination}/`


        Alternate route: `/v1/route/{origin}/{destination}/`


        ---

        This route is cached for up to 86400 seconds'
      operationId: get_route_origin_destination
      parameters:
      - description: avoid solar system ID(s)
        in: query
        name: avoid
        style: form
        explode: false
        schema:
          type: array
          items:
            format: int32
            type: integer
          maxItems: 100
          uniqueItems: true
        example:
        - 1
      - description: connected solar system pairs
        in: query
        name: connections
        style: form
        explode: false
        schema:
          type: array
          items:
            items:
              format: int32
              type: integer
            maxItems: 2
            minItems: 2
            type: array
            uniqueItems: true
          maxItems: 100
          uniqueItems: true
        x-s2o-warning: Nested collectionFormats are not supported
        example:
        - - 1
      - $ref: '#/components/parameters/datasource'
      - description: destination solar system ID
        in: path
        name: destination
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      - description: route security preference
        in: query
        name: flag
        schema:
          type: string
          enum:
          - shortest
          - secure
          - insecure
          default: shortest
        example: shortest
      - $ref: '#/components/parameters/If-None-Match'
      - description: origin solar system ID
        in: path
        name: origin
        required: true
        schema:
          type: integer
          format: int32
        example: 1
      responses:
        '200':
          description: Solar systems in route from origin to destination
          headers:
            Cache-Control:
              description: The caching mechanism used
              schema:
                type: string
            ETag:
              description: RFC7232 compliant entity tag
              schema:
                type: string
            Expires:
              description: RFC7231 formatted datetime string
              schema:
                type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              schema:
                type: string
          content:
            application/json:
              schema:
                description: Solar systems in route
                items:
                  description: Solar system in route
                  format: int32
                  title: Solar system ID
                  type: integer
                maxItems: 1000
                title: get_route_origin_destination_ok
                type: array
              examples:
                response:
                  value:
                  - 30002771
                  - 30002770
                  - 30002769
                  - 30002772
        '304':
          description: Not modified
          headers:
            Cache-Control:
              description: The caching mechanism used
              schema:
                type: string
            ETag:
              description: RFC7232 compliant entity tag
              schema:
                type: string
            Expires:
              description: RFC7231 formatted datetime string
              schema:
                type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              schema:
                type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bad_request'
              examples:
                response:
                  value:
                    error: Bad request message
        '404':
          description: No route found
          content:
            application/json:
              schema:
                description: Not found
                properties:
                  error:
                    description: Not found message
                    title: get_route_origin_destination_404_not_found
                    type: string
                title: get_route_origin_destination_not_found
                type: object
              examples:
                response:
                  value:
                    error: Not found message
        '420':
          description: Error limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_limited'
              examples:
                response:
                  value:
                    error: Error limited message
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server_error'
              examples:
                response:
                  value:
                    error: Internal server error message
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/service_unavailable'
              examples:
                response:
                  value:
                    error: Service unavailable message
        '504':
          description: Gateway timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway_timeout'
              examples:
                response:
                  value:
                    error: Gateway timeout message
      summary: EVE Online Get Route
      tags:
      - Routes
      x-alternate-versions:
      - dev
      - legacy
      - v1
      x-cached-seconds: 86400
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v1/route/{origin}/{destination}/:
    get:
      description: 'Get the systems between origin and destination


        ---


        This route is cached for up to 86400 seconds'
      operationId: get_route_origin_destination
      parameters:
      - description: avoid solar system ID(s)
        in: query
        items:
          format: int32
          type: integer
        maxItems: 100
        name: avoid
        type: array
        uniqueItems: true
      - description: connected solar system pairs
        in: query
        items:
          collectionFormat: pipes
          items:
            format: int32
            type: integer
          maxItems: 2
          minItems: 2
          type: array
          uniqueItems: true
        maxItems: 100
        name: connections
        type: array
        uniqueItems: true
      - $ref: '#/parameters/datasource'
      - description: destination solar system ID
        format: int32
        in: path
        name: destination
        required: true
        type: integer
      - default: shortest
        description: route security preference
        enum:
        - shortest
        - secure
        - insecure
        in: query
        name: flag
        type: string
      - $ref: '#/parameters/If-None-Match'
      - description: origin solar system ID
        format: int32
        in: path
        name: origin
        required: true
        type: integer
      responses:
        '200':
          description: Solar systems in route from origin to destination
          examples:
            application/json:
            - 30002771
            - 30002770
            - 30002769
            - 30002772
          headers:
            Cache-Control:
              description: The caching mechanism used
              type: string
            ETag:
              description: RFC7232 compliant entity tag
              type: string
            Expires:
              description: RFC7231 formatted datetime string
              type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              type: string
          schema:
            description: Solar systems in route
            items:
              description: Solar system in route
              format: int32
              title: Solar system ID
              type: integer
            maxItems: 1000
            title: get_route_origin_destination_ok
            type: array
        '304':
          description: Not modified
          headers:
            Cache-Control:
              description: The caching mechanism used
              type: string
            ETag:
              description: RFC7232 compliant entity tag
              type: string
            Expires:
              description: RFC7231 formatted datetime string
              type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              type: string
        '400':
          description: Bad request
          examples:
            application/json:
              error: Bad request message
          schema:
            $ref: '#/definitions/bad_request'
        '404':
          description: No route found
          examples:
            application/json:
              error: Not found message
          schema:
            description: Not found
            properties:
              error:
                description: Not found message
                title: get_route_origin_destination_404_not_found
                type: string
            title: get_route_origin_destination_not_found
            type: object
        '420':
          description: Error limited
          examples:
            application/json:
              error: Error limited message
          schema:
            $ref: '#/definitions/error_limited'
        '500':
          description: Internal server error
          examples:
            application/json:
              error: Internal server error message
          schema:
            $ref: '#/definitions/internal_server_error'
        '503':
          description: Service unavailable
          examples:
            application/json:
              error: Service unavailable message
          schema:
            $ref: '#/definitions/service_unavailable'
        '504':
          description: Gateway timeout
          examples:
            application/json:
              error: Gateway timeout message
          schema:
            $ref: '#/definitions/gateway_timeout'
      summary: Get route
      tags:
      - Routes
      x-alternate-versions:
      - latest
      - legacy
      - v1
      x-cached-seconds: 86400
components:
  schemas:
    internal_server_error:
      description: Internal server error model
      properties:
