  /corporation/{corporation_id}/mining/observers/{observer_id}/:
    get:
      description: 'Paginated record of all mining seen by an observer



        ---

        Alternate route: `/dev/corporation/{corporation_id}/mining/observers/{observer_id}/`


        Alternate route: `/legacy/corporation/{corporation_id}/mining/observers/{observer_id}/`


        Alternate route: `/v1/corporation/{corporation_id}/mining/observers/{observer_id}/`


        ---

        This route is cached for up to 3600 seconds


        ---

        Requires one of the following EVE corporation role(s): Accountant

        '
      operationId: get_corporation_corporation_id_mining_observers_observer_id
      parameters:
      - $ref: '#/components/parameters/corporation_id'
      - $ref: '#/components/parameters/datasource'
      - $ref: '#/components/parameters/If-None-Match'
