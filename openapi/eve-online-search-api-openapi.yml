                type: array
              region:
                description: region array
                items:
                  description: region integer
                  format: int32
                  title: get_characters_character_id_search_region_region
                  type: integer
                maxItems: 500
                title: get_characters_character_id_search_region
                type: array
              solar_system:
                description: solar_system array
