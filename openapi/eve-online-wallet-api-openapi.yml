  /corporations/{corporation_id}/wallets/:
    get:
      description: 'Get a corporation''s wallets


        ---

        Alternate route: `/dev/corporations/{corporation_id}/wallets/`


        Alternate route: `/legacy/corporations/{corporation_id}/wallets/`


        Alternate route: `/v1/corporations/{corporation_id}/wallets/`


        ---

        This route is cached for up to 300 seconds


        ---

        Requires one of the following EVE corporation role(s): Accountant, Junior_Accountant

        '
      operationId: get_corporations_corporation_id_wallets
      parameters:
      - $ref: '#/components/parameters/corporation_id'
      - $ref: '#/components/parameters/datasource'
      - $ref: '#/components/parameters/If-None-Match'
      - $ref: '#/components/parameters/token'
      responses:
        '200':
          description: List of corporation wallets
          headers:
            Cache-Control:
              description: The caching mechanism used
              schema:
                type: string
            ETag:
              description: RFC7232 compliant entity tag
              schema:
                type: string
            Expires:
              description: RFC7231 formatted datetime string
              schema:
                type: string
            Last-Modified:
              description: RFC7231 formatted datetime string
              schema:
                type: string
          content:
            application/json:
              schema:
                description: 200 ok array
                items:
                  description: 200 ok object
                  properties:
                    balance:
                      description: balance number
                      format: double
                      title: get_corporations_corporation_id_wallets_balance
                      type: number
                    division:
                      description: division integer
                      format: int32
                      maximum: 7
                      minimum: 1
                      title: get_corporations_corporation_id_wallets_division
                      type: integer
                  required:
                  - division
                  - balance
                  title: get_corporations_corporation_id_wallets_200_ok
                  type: object
                maxItems: 7
                title: get_corporations_corporation_id_wallets_ok
                type: array
              examples:
                response:
                  value:
                  - balance: 123.45
                    division: 1
                  - balance: 123.45
                    division: 2
                  - balance: 123.45
                    division: 3
                  - balance: 123.45
                    division: 4
                  - balance: 123.45
                    division: 5
                  - balance: 123.45
                    division: 6
                  - balance: 123.45
                    division: 7
        '304':
          description: Not modified
          headers:
            Cache-Control:
              description: The caching mechanism used
              schema:
                type: string
            ETag:
              description: RFC7232 compliant entity tag
              schema:
                type: string
            Expires:
              description: RFC7231 formatted datetime string
              schema:
                type: string
            Last-Modified:
