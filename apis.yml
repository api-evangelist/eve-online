    url: https://developers.eveonline.com/
- aid: eve-online:image-server
  name: EVE Image Server (IEC)
  description: >-
    The EVE Image Server (also referred to as IEC, the Image Export Collection) is a public, anonymous
    HTTP service hosted at images.evetech.net that returns portraits and renders for in-game entities.
    Supported resources include character portraits, corporation and alliance logos, type icons and renders,
    and faction logos. Image size variants are requested via the size query parameter (32, 64, 128, 256,
    512, 1024) and the service is backed by a CDN with strong cache headers.
  humanURL: https://developers.eveonline.com/docs/services/image-server/
  baseURL: https://images.evetech.net
  tags:
  - CDN
  - Image
  - Portraits
  - Renders
  tags_raw:
  - CDN
  - Images
  - Portraits
  - Renders
  properties:
  - type: Documentation
    url: https://developers.eveonline.com/docs/services/image-server/
  contact:
  - FN: ESI Developers
    url: https://developers.eveonline.com/
- aid: eve-online:static-data-export
  name: EVE Static Data Export (SDE)
  description: >-
    The EVE Static Data Export (SDE) is the bulk download of all the static reference data behind the
    EVE universe — types, groups, categories, market groups, dogma attributes, blueprints, regions, constellations,
    solar systems, stations, certificates, and translations. It is the dataset most third-party developers
    cache locally rather than calling ESI for every universe lookup. CCP publishes the SDE as YAML, with
    community projects converting it to SQLite, MySQL, PostgreSQL, MS SQL, JSON, and Parquet for different
    workloads.
  humanURL: https://developers.eveonline.com/docs/services/sde/
  baseURL: https://developers.eveonline.com/static-data
  tags:
  - Bulk Data
  - Reference Data
  - SDE
  - Static Data
  properties:
  - type: Documentation
    url: https://developers.eveonline.com/docs/services/sde/
  - type: Download
    url: https://developers.eveonline.com/static-data
  - type: CommunityConversions
    url: https://developers.eveonline.com/docs/community/sde-conversion/
  contact:
  - FN: ESI Developers
    url: https://developers.eveonline.com/
- aid: eve-online:eve-online-game
  name: EVE Online Game Client
  description: >-
    EVE Online is the underlying massively multiplayer online (MMO) space game from CCP Games. The game
    client is the consumer of the third-party developer ecosystem — it is where capsuleers actually fly
    ships, run corporations, and trade on the market that ESI surfaces. The official launcher, client
    downloads, account management, and game patch notes live on eveonline.com.
  humanURL: https://www.eveonline.com
  tags:
  - Game
  - MMO
  - Space
